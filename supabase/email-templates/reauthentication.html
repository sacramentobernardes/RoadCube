<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Seu código. RoadCube</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f4f4f5;">Seu código de confirmação do RoadCube.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f5" style="background:#f4f4f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
          <tr>
            <td style="padding:0 4px 18px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.8px;line-height:28px;color:#111214;">RoadCube<span style="color:#d2392b;">.</span></td>
                  <td align="right" width="40"><table role="presentation" cellpadding="0" cellspacing="2" border="0" bgcolor="#111214" style="background:#111214;border-radius:5px;border-collapse:separate;"><tbody><tr><td width="9" height="9" bgcolor="#f2c230" style="width:9px;height:9px;background:#f2c230;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#f2c230" style="width:9px;height:9px;background:#f2c230;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#d2392b" style="width:9px;height:9px;background:#d2392b;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td></tr><tr><td width="9" height="9" bgcolor="#1f9d5c" style="width:9px;height:9px;background:#1f9d5c;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#f2c230" style="width:9px;height:9px;background:#f2c230;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#2563c9" style="width:9px;height:9px;background:#2563c9;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td></tr><tr><td width="9" height="9" bgcolor="#f2c230" style="width:9px;height:9px;background:#f2c230;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#f07a26" style="width:9px;height:9px;background:#f07a26;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td><td width="9" height="9" bgcolor="#f2c230" style="width:9px;height:9px;background:#f2c230;font-size:0;line-height:0;border-radius:2px;">&nbsp;</td></tr></tbody></table></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td bgcolor="#ffffff" style="background:#ffffff;border:1px solid #e2e3e6;border-radius:8px;padding:36px 32px;">
              <p style="margin:0;font-family:Consolas,Menlo,'Courier New',monospace;font-size:12px;letter-spacing:1.2px;line-height:18px;color:#5b5e66;text-transform:uppercase;"><span style="color:#d2392b;">&#9632;</span>&nbsp; Confirmar identidade</p>
              <h1 style="margin:14px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:34px;font-weight:700;letter-spacing:-1.3px;line-height:38px;color:#111214;">Seu código.</h1>
              <p style="margin:14px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#5b5e66;">Use este código para confirmar que é você.</p>
              <p style="margin:28px 0 0;padding:18px 0;border-top:1px solid #e2e3e6;border-bottom:1px solid #e2e3e6;font-family:Consolas,Menlo,'Courier New',monospace;font-size:32px;font-weight:600;letter-spacing:6px;line-height:40px;color:#111214;text-align:center;">{{ .Token }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5b5e66;">Se você não pediu este código, ignore este e-mail. Não compartilhe o código com ninguém.</td>
          </tr>
          <tr>
            <td style="padding:14px 4px 0;font-family:Consolas,Menlo,'Courier New',monospace;font-size:12px;line-height:18px;color:#5b5e66;"><a href="{{ .SiteURL }}" style="color:#5b5e66;text-decoration:underline;">roadcube.com.br</a></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
